services:
  - type: web
    name: lpcd-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: ALLOWED_ORIGINS
        value: https://*.vercel.app,http://localhost:5173
